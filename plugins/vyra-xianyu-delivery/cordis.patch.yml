- insert:
    - id: xianyu-delivery
      name: 'vyra-xianyu-delivery'
      config:
        pollSeconds: 60
        mode: send_then_confirm
        blockRefund: true
        blockZeroAmount: true
        sendIntervalMs: 60000
        chatPollSeconds: 15
        watchEnabled: false   # 常驻监听会和 CLI 调用抢 IM 连接，默认靠轮询
        ai:
          enabled: false
          mode: dsh            # dsh = 用 DSH 的 agent；api = 直连 OpenAI 兼容接口
          agentPreset: ''      # Agent Manager 里创建的 agent id；留空用默认
          provider: ''         # 留空用 profile 默认模型
          model: ''
          skillsDir: ''        # 默认 ~/.dsh/skills
          cooldownSeconds: 8
          maxRepliesPerChat: 8
