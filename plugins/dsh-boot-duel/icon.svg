<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="开工大吉">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12162a"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#ffe9fb" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#2b3350" stroke-width="1"/>

  <circle cx="32" cy="30" r="13" fill="url(#impact)"/>

  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6">
    <!-- left fighter: cyan, lunging right -->
    <g stroke="#35e0ff">
      <circle cx="21" cy="22.5" r="3.1" fill="#35e0ff" stroke="none"/>
      <path d="M21 26v9"/>
      <path d="M21 29.5l6.5 -1.5"/>
      <path d="M21 29.5l-4.5 4"/>
      <path d="M21 35l-3.5 6.5"/>
      <path d="M21 35l4 6.5"/>
    </g>
    <!-- right fighter: magenta, lunging left -->
    <g stroke="#ff4fd8">
      <circle cx="43" cy="23.5" r="3.1" fill="#ff4fd8" stroke="none"/>
      <path d="M43 27v9"/>
      <path d="M43 30.5l-6.5 -1.5"/>
      <path d="M43 30.5l4.5 4"/>
      <path d="M43 36l3.5 6.5"/>
      <path d="M43 36l-4 6.5"/>
    </g>
  </g>

  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity=".9">
    <path d="M32 24.5v-4"/>
    <path d="M32 39.5v4"/>
    <path d="M26.5 27.5l-2.8 -2.2"/>
    <path d="M37.5 27.5l2.8 -2.2"/>
    <path d="M26.5 36.5l-2.8 2.2"/>
    <path d="M37.5 36.5l2.8 2.2"/>
  </g>

  <line x1="12" y1="52" x2="52" y2="52" stroke="#2b3350" stroke-width="1.4" stroke-linecap="round"/>
</svg>
