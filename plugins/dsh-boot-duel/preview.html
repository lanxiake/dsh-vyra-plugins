<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>duel — 核心预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #9a9a9a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0 0 auto 0; display: flex; gap: 12px;
    padding: 10px 16px; font: 600 13px/1.4 system-ui, sans-serif;
    color: #1a1a1a; pointer-events: none; user-select: none;
  }
  .bar { flex: 1; height: 10px; background: #0002; border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #111; width: 100%; transition: width .12s; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
    font: 12px system-ui, sans-serif; color: #222; opacity: .75; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar"><i id="php"></i></div>
  <div style="min-width: 90px; text-align: center" id="state">准备</div>
  <div class="bar"><i id="ehp" style="margin-left:auto; background:#fff"></i></div>
</div>
<div id="hint">A / D 移动 · J 直拳 · K 摆拳 · L 踢击 · I 上勾 · U 扫腿 · Shift 滑铲 · Enter 开始</div>
<script type="module">
import { Arena, WORLD, DT } from './js/arena.js'
import { Renderer } from './js/render.js'

const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const renderer = new Renderer(canvas, ctx)
const arena = new Arena()

const KEYS = {
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
  KeyJ: 'jab', KeyK: 'punch2', KeyL: 'kick',
  KeyI: 'upper', KeyU: 'sweep',
  ShiftLeft: 'slide', ShiftRight: 'slide',
  KeyS: 'block',
}
const held = new Set()
const input = () => {
  const out = { left: false, right: false, jab: false, punch2: false, kick: false, upper: false, sweep: false, slide: false, block: false }
  for (const code of held) { const k = KEYS[code]; if (k) out[k] = true }
  return out
}
// Attacks are edge-triggered: a held key must not repeat a move.
const edges = new Set()
window.addEventListener('keydown', (e) => {
  if (e.code === 'Enter') { arena.begin(); return }
  if (!(e.code in KEYS)) return
  e.preventDefault()
  if (!held.has(e.code)) edges.add(e.code)
  held.add(e.code)
})
window.addEventListener('keyup', (e) => { held.delete(e.code) })

function resize() {
  const dpr = window.devicePixelRatio || 1
  renderer.resize(window.innerWidth, window.innerHeight, dpr)
}
window.addEventListener('resize', resize)
resize()

let last = performance.now()
let acc = 0
const STEP = DT * 1000

function frame(now) {
  const dt = Math.min(250, now - last)
  last = now

  // Juice advances in real time and returns the simulation time scale.
  const scale = arena.juice.update(dt / 1000)
  acc += dt * scale
  let steps = 0
  while (acc >= STEP && steps < 5) {
    const inp = input()
    for (const code of edges) { const k = KEYS[code]; if (k && inp[k] !== undefined) inp[k] = true }
    arena.step(inp)
    edges.clear()
    acc -= STEP
    steps++
  }

  renderer.draw(arena.snapshot())
  document.getElementById('php').style.width = `${(arena.player.hp / arena.player.maxHp) * 100}%`
  document.getElementById('ehp').style.width = `${(arena.enemy.hp / arena.enemy.maxHp) * 100}%`
  document.getElementById('state').textContent =
    arena.phase === 'ready' ? '准备' : arena.phase === 'playing' ? '对决' : arena.phase === 'ko' ? '击倒' : '结束'
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)

// Expose for the headless harness.
window.__duel = { arena, renderer, WORLD }
</script>
</body>
</html>
