# The dsh-tool-ocr bundle patch: one insert adding the OCR tool suite.
#
# Engines are configured by overriding this row in the profile's own
# cordis.patch.yml (the last write wins per row):
#
#   - id: tool-ocr
#     config:
#       backend: command
#       engines:
#         - id: windows            # the OCR engine built into Windows 10/11
#           label: Windows OCR
#           mode: winrt
#           isDefault: true
#         - id: tesseract          # an external engine, run as a command
#           label: Tesseract (chi_sim+eng)
#           command: tesseract
#           args: ["{input}", "{output}", "-l", "chi_sim+eng"]
#       outputDir: C:/Users/<you>/Documents/ocr-output
#
# With `backend: winrt` and no engine configured, every call uses the Windows
# engine — nothing to install.

- insert:
    - id: tool-ocr
      name: "@yuehancn/dsh-tool-ocr"