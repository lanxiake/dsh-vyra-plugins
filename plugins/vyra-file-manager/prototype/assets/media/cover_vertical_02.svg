      <stop offset=".55" stop-color="#a7511d"/>
      <stop offset="1" stop-color="#efb264"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3b8" stop-opacity=".9"/>
